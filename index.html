<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entregas Programación - Bio-Python</title>
  <style>
    :root {
      --bg: #0f1115;
      --sidebar-bg: #161923;
      --sidebar-border: #262b3a;
      --accent: #6c8cff;
      --accent-soft: rgba(108, 140, 255, 0.15);
      --text: #e6e8ef;
      --text-dim: #8b90a3;
      --card-bg: #1b1f2b;
      --card-border: #2a2f40;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-title {
      font-size: 1.05rem;
      line-height: 1.35;
      font-weight: 600;
      color: var(--text);
      padding: 24px 20px 16px;
      margin: 0;
      border-bottom: 1px solid var(--sidebar-border);
    }

    .sidebar-title span {
      color: var(--accent);
      font-weight: 700;
    }

    .tabs {
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 2px;
    }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 0.92rem;
      text-align: left;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
    }

    .tab-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .tab-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .tab-btn:disabled:hover {
      background: transparent;
      color: var(--text-dim);
    }

    .tab-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .tab-btn.active .tab-num {
      background: var(--accent);
      color: #0f1115;
    }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
    }

    .panel {
      display: none;
      height: 100%;
      flex-direction: column;
    }

    .panel.active {
      display: flex;
    }

    .panel-header {
      margin-bottom: 20px;
    }

    .panel-header h2 {
      margin: 0 0 6px;
      font-size: 1.4rem;
    }

    .panel-header p {
      margin: 0;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .pdf-wrapper {
      flex: 1;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #20232e;
      min-height: 0;
    }

    .pdf-wrapper embed,
    .pdf-wrapper iframe,
    .pdf-wrapper object {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .pdf-fallback {
      padding: 20px;
      color: var(--text-dim);
      font-size: 0.9rem;
    }

    .pdf-fallback a {
      color: var(--accent);
    }

    .empty-card {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-dim);
      font-size: 0.95rem;
      text-align: center;
      padding: 40px;
    }

    /* ===== INTRO CON ICONOS ===== */
    .intro-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 780px;
      margin: 0 auto;
      width: 100%;
      padding: 20px 0;
    }

    .intro-card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--card-border);
      padding: 48px 44px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      transition: border-color 0.2s;
      position: relative;
      overflow: hidden;
    }

    /* Decoración de fondo sutil */
    .intro-card::before {
      content: "🦇";
      position: absolute;
      font-size: 10rem;
      opacity: 0.04;
      right: -20px;
      bottom: -30px;
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .intro-card:hover {
      border-color: rgba(108, 140, 255, 0.25);
    }

    .intro-emoji-row {
      display: flex;
      gap: 12px;
      font-size: 1.8rem;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .intro-emoji-row span {
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    .intro-emoji-row span:nth-child(2) {
      animation-delay: 0.5s;
    }
    .intro-emoji-row span:nth-child(3) {
      animation-delay: 1s;
    }
    .intro-emoji-row span:nth-child(4) {
      animation-delay: 1.5s;
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-4px);
      }
    }

    .intro-badge {
      display: inline-block;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 4px 16px;
      border-radius: 40px;
      border: 1px solid rgba(108, 140, 255, 0.15);
      margin-bottom: 20px;
    }

    .intro-name {
      font-size: 2.4rem;
      font-weight: 700;
      margin: 0 0 2px;
      line-height: 1.2;
      color: #fff;
    }

    .intro-name span {
      color: var(--accent);
    }

    .intro-sub {
      font-size: 1rem;
      color: var(--text-dim);
      margin: 0 0 24px;
      border-left: 3px solid var(--accent);
      padding-left: 16px;
    }

    .intro-body {
      font-size: 1rem;
      line-height: 1.8;
      color: var(--text-dim);
    }

    .intro-body p {
      margin: 0 0 14px;
    }

    .intro-body p:last-child {
      margin-bottom: 0;
    }

    .intro-body strong {
      color: var(--text);
      font-weight: 600;
    }

    .intro-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--card-border);
    }

    .intro-tags span {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 6px 18px;
      border-radius: 40px;
      font-size: 0.8rem;
      color: var(--text-dim);
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .intro-tags span .tag-icon {
      font-size: 1rem;
    }

    @media (max-width: 700px) {
      .content {
        padding: 20px 16px;
      }
      .intro-card {
        padding: 32px 20px;
      }
      .intro-name {
        font-size: 1.8rem;
      }
      .intro-emoji-row {
        font-size: 1.4rem;
      }
      .intro-card::before {
        font-size: 6rem;
        right: -10px;
        bottom: -10px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="sidebar-title">Entregas Programación<br><span>Bio-Python</span></h1>
      <nav class="tabs" id="tabs"></nav>
    </aside>

    <main class="content" id="content"></main>
  </div>

  <script>
    const TOTAL_ENTREGAS = 17;

    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");

    const pdfName = (n) => `EntregaSemana_${n}.pdf`;

    // ---------- Construir pestaña "Introducción" ----------
    function buildIntroTab() {
      const btn = document.createElement("button");
      btn.className = "tab-btn active";
      btn.dataset.tab = "intro";
      btn.disabled = false;
      btn.innerHTML = `<span class="tab-num">🦇</span> Introducción`;
      btn.addEventListener("click", () => activateTab("intro"));
      tabsEl.prepend(btn);
    }

    function buildIntroPanel() {
      const panel = document.createElement("section");
      panel.className = "panel active";
      panel.id = "panel-intro";

      panel.innerHTML = `
        <div class="panel-header">
          <h2>🦇 Introducción</h2>
          <p>Estudiante de Biología · Bio-Python 2026</p>
        </div>
        <div class="intro-container">
          <div class="intro-card">
            <div class="intro-emoji-row">
              <span>🧬</span>
              <span>🦇</span>
              <span>🐍</span>
              <span>🔬</span>
            </div>
            <div class="intro-badge">✦ Presentación</div>
            <h1 class="intro-name">Verónica <span>·</span> 2026</h1>
            <div class="intro-sub">🌱 Estudiante de pregrado en Biología</div>
            <div class="intro-body">
              <p>
                Hola, soy <strong>Verónica</strong> 🦇. Estudio Biología en la 
                promoción 2026 y me fascina la conexión entre la 
                <strong>biología molecular</strong> y el 
                <strong>análisis computacional</strong>.
              </p>
              <p>
                Este espacio reúne mis entregas del curso 
                <strong>Bio-Python</strong> 🐍, donde exploro cómo la 
                programación puede ayudarnos a entender mejor los 
                sistemas biológicos. Cada semana subo un nuevo avance, 
                desde ejercicios prácticos hasta pequeños proyectos 
                de análisis de datos.
              </p>
            </div>
            <div class="intro-tags">
              <span><span class="tag-icon">🧬</span> Biología</span>
              <span><span class="tag-icon">🐍</span> Python</span>
              <span><span class="tag-icon">📊</span> Datos</span>
              <span><span class="tag-icon">🔬</span> Investigación</span>
              <span><span class="tag-icon">🦇</span> Bioinformática</span>
            </div>
          </div>
        </div>
      `;
      contentEl.prepend(panel);
    }

    // ---------- Pestañas de entregas ----------
    function buildTabs() {
      for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.dataset.tab = i;
        btn.disabled = true;
        btn.innerHTML = `<span class="tab-num">${i}</span> Semana ${i}`;
        btn.addEventListener("click", () => activateTab(i));
        tabsEl.appendChild(btn);
      }
    }

    function buildPanels() {
      for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
        const panel = document.createElement("section");
        panel.className = "panel";
        panel.id = `panel-${i}`;
        panel.innerHTML = `
          <div class="panel-header">
            <h2>Semana ${i}</h2>
            <p>Contenido pendiente por agregar</p>
          </div>
          <div class="empty-card">Aún no se ha añadido el archivo "${pdfName(i)}" para esta semana.</div>
        `;
        contentEl.appendChild(panel);
      }
    }

    function renderPdf(n) {
      const name = pdfName(n);
      const panel = document.getElementById(`panel-${n}`);
      panel.innerHTML = `
        <div class="panel-header">
          <h2>Semana ${n}</h2>
          <p>Visualización embebida: ${name}</p>
        </div>
        <div class="pdf-wrapper">
          <embed src="${name}" type="application/pdf" />
        </div>
        <div class="pdf-fallback">
          Si el PDF no se visualiza correctamente, puedes <a href="${name}" target="_blank" rel="noopener">abrirlo en una nueva pestaña</a>.
        </div>
      `;
    }

    function enableTab(n) {
      const btn = tabsEl.querySelector(`.tab-btn[data-tab="${n}"]`);
      if (btn) btn.disabled = false;
    }

    // ---------- Detectar PDFs ----------
    function fileExists(url) {
      return new Promise((resolve) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = url;
        link.onload = () => { link.remove();
          resolve(true); };
        link.onerror = () => { link.remove();
          resolve(false); };
        document.head.appendChild(link);
      });
    }

    async function detectPdfs() {
      const found = [];
      await Promise.all(
        Array.from({ length: TOTAL_ENTREGAS }, async (_, idx) => {
          const n = idx + 1;
          if (await fileExists(pdfName(n))) {
            renderPdf(n);
            enableTab(n);
            found.push(n);
          }
        })
      );
      return found.sort((a, b) => a - b);
    }

    // ---------- Cambio de pestaña ----------
    function activateTab(id) {
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.remove("active");
      });
      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.remove("active");
      });

      const targetBtn = tabsEl.querySelector(`.tab-btn[data-tab="${id}"]`);
      if (targetBtn) targetBtn.classList.add("active");

      const targetPanel = document.getElementById(`panel-${id}`);
      if (targetPanel) targetPanel.classList.add("active");

      if (id === "intro") {
        window.location.hash = "introduccion";
      } else {
        window.location.hash = `semana-${id}`;
      }
    }

    // ---------- Inicialización ----------
    async function init() {
      buildIntroTab();
      buildIntroPanel();
      buildTabs();
      buildPanels();

      const found = await detectPdfs();

      const hash = window.location.hash;
      let initialTab = "intro";

      if (hash.includes("semana-")) {
        const match = hash.match(/semana-(\d+)/);
        if (match) {
          const num = Number(match[1]);
          if (found.includes(num)) {
            initialTab = num;
          }
        }
      } else if (hash.includes("introduccion")) {
        initialTab = "intro";
      }

      if (found.length > 0 && initialTab === "intro" && !hash.includes("introduccion") && !hash.includes("semana-")) {
        initialTab = found[0];
      }

      activateTab(initialTab);
    }

    init();
  </script>
</body>
</html>
